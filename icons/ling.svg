<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="body" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#f8ffe9"/>
      <stop offset="55%" stop-color="#c8ec7a"/>
      <stop offset="100%" stop-color="#7cbc3a"/>
    </radialGradient>
    <radialGradient id="belly" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fffdf4"/>
      <stop offset="100%" stop-color="#ffe9b0"/>
    </radialGradient>
    <radialGradient id="leaf" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#d8ff7a"/>
      <stop offset="100%" stop-color="#3d9a3a"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1d5a46" flood-opacity=".22"/>
    </filter>
  </defs>
  <!-- shadow -->
  <ellipse cx="128" cy="232" rx="62" ry="12" fill="#1d5a46" opacity=".18"/>
  <!-- leaves -->
  <g filter="url(#soft)">
    <path d="M118 78 C88 28, 36 42, 58 92 C78 78, 100 80, 118 78Z" fill="url(#leaf)"/>
    <path d="M138 76 C168 20, 226 40, 198 94 C176 76, 152 78, 138 76Z" fill="url(#leaf)"/>
    <path d="M128 54 C122 18, 148 8, 150 46 C140 44, 132 48, 128 54Z" fill="#4eae45"/>
  </g>
  <!-- arms -->
  <ellipse cx="58" cy="150" rx="22" ry="14" transform="rotate(-28 58 150)" fill="#8ed14a"/>
  <ellipse cx="198" cy="150" rx="22" ry="14" transform="rotate(28 198 150)" fill="#8ed14a"/>
  <!-- body -->
  <circle cx="128" cy="150" r="74" fill="url(#body)" filter="url(#soft)"/>
  <ellipse cx="128" cy="168" rx="42" ry="32" fill="url(#belly)"/>
  <!-- blush -->
  <ellipse cx="86" cy="158" rx="14" ry="8" fill="#ff9aa0" opacity=".7"/>
  <ellipse cx="170" cy="158" rx="14" ry="8" fill="#ff9aa0" opacity=".7"/>
  <!-- eyes -->
  <ellipse cx="104" cy="142" rx="11" ry="13" fill="#1d3b33"/>
  <ellipse cx="152" cy="142" rx="11" ry="13" fill="#1d3b33"/>
  <circle cx="108" cy="137" r="4" fill="#fff"/>
  <circle cx="156" cy="137" r="4" fill="#fff"/>
  <circle cx="106" cy="146" r="1.6" fill="#fff" opacity=".8"/>
  <circle cx="154" cy="146" r="1.6" fill="#fff" opacity=".8"/>
  <!-- smile -->
  <path d="M116 170 Q128 182 140 170" fill="none" stroke="#1d3b33" stroke-width="4" stroke-linecap="round"/>
  <!-- sparkle -->
  <path d="M206 86 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#ffd45a"/>
</svg>
